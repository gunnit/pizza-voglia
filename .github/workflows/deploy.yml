name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Static site: publish the repo minus dev-only files (docs, tests, scripts, tooling).
      - name: Assemble _site
        run: |
          rsync -a \
            --exclude '_site' --exclude '.git*' --exclude '.github' --exclude '.claude' \
            --exclude 'docs' --exclude 'tests' --exclude 'scripts' --exclude 'node_modules' \
            --exclude 'package.json' --exclude 'package-lock.json' --exclude 'README.md' \
            --exclude 'assets/_src' \
            ./ _site/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
