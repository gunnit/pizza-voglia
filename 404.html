<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pagina non trovata — Pizza Voglia</title>
<style>
  @font-face { font-family: "Instrument Serif"; font-weight: 400; font-display: swap; src: url("/assets/fonts/instrument-serif-latin-400.woff2") format("woff2"); }
  @font-face { font-family: "Instrument Serif"; font-style: italic; font-weight: 400; font-display: swap; src: url("/assets/fonts/instrument-serif-latin-400-italic.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 300 700; font-display: swap; src: url("/assets/fonts/inter-latin-var.woff2") format("woff2"); }
  :root { --paper: #f6efe3; --ink: #1d1915; --tomato: #c8341f; --muted: #6b6157; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; background: var(--paper); color: var(--ink); font: 400 17px/1.55 Inter, system-ui, sans-serif; text-align: center; }
  h1 { font: 400 clamp(44px, 9vw, 88px)/1 "Instrument Serif", Georgia, serif; margin: 0 0 14px; }
  h1 em { color: var(--tomato); }
  p { color: var(--muted); margin: 0 0 28px; }
  .btns { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  a { display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; border-radius: 999px; font-weight: 600; text-decoration: none; }
  .primary { background: var(--tomato); color: #fff; }
  .ghost { box-shadow: inset 0 0 0 1.5px var(--ink); color: var(--ink); }
  a:focus-visible { outline: 3px solid var(--tomato); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>Questa teglia <em>è finita</em>.</h1>
  <p>La pagina che cerchi non esiste. Ma in vetrina c'è sempre qualcosa di pronto.</p>
  <div class="btns">
    <a class="primary" href="/">Torna alla home</a>
    <a class="ghost" href="tel:+393662205988">Chiama 366 220 5988</a>
  </div>
</main>
</body>
</html>
